# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
# ↓↓↓ 想改成自己的，只改下面这几行就够了 ↓↓↓
title: 不知道哦                 # 站点标题（左上角 + 浏览器标签）
subtitle: '大肥鱼🐟交流'   # 首页大标题下方的副标题
description: '一个插件站：'
keywords: DSH,大肥鱼
author: 不不不不不不不                # 博主昵称（侧边栏 + 版权信息）
language: zh-CN
timezone: Asia/Shanghai

# URL
## 部署后把 url 改成你的真实域名，例如 https://xxx.netlify.app
url: https://jnhjjbj.github.io/buzhidaoo
root: /buzhidaoo/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
# ParticleX 自带代码高亮，必须关掉 Hexo 的，否则冲突
syntax_highlighter:
highlight:
  enable: false
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: false
prismjs:
  enable: false
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 6
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 6
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: particlex
# 本地搜索（配合主题 search.use: local_search）
search:
  path: search.xml
  field: post
  content: true
  format: html

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
## 想发到 GitHub Pages 就把下面换成：
## deploy:
##   type: git
##   repo: https://github.com/<你的用户名>/<仓库名>.git
##   branch: gh-pages
deploy:
  type: ''

# ParticleX 不需要年/月归档
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false